name: VietPickleball
options:
  bundleIdPrefix: vn.vietpickleball
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 47U2Y457Q8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  VietPickleball:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.vietpickleball.app
        PRODUCT_NAME: VietPickleball
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: VietPickleball
        CFBundleDevelopmentRegion: vi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [vi, en]
        CFBundleURLTypes:
          - CFBundleURLName: vn.vietpickleball.app
            CFBundleURLSchemes: [vietpickleball]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        NSCameraUsageDescription: "VietPickleball dùng camera để chụp ảnh chân dung cho hồ sơ vận động viên và quét mã vạch khi bán hàng tại sân."
        NSPhotoLibraryUsageDescription: "VietPickleball cần quyền thư viện ảnh để bạn chọn ảnh chân dung hoặc ảnh sân để tải lên."
        NSPhotoLibraryAddUsageDescription: "VietPickleball lưu mã QR, giấy chứng nhận và hóa đơn vào thư viện ảnh khi bạn chọn Lưu ảnh."
